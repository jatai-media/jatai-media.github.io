name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            jatai_video/package-lock.json
            jatai_lang/ide/package-lock.json
      - run: npm ci
      # O editor de video e a plataforma da linguagem sao projetos a parte, com
      # dependencias proprias. Os dois compilam o jatai.wasm de jatai_lang/.
      - run: npm ci --prefix jatai_video
      - run: npm ci --prefix jatai_lang/ide
      # Hub + jatai_image, e os builds de jatai_video e jatai_lang/ide em dist/.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
