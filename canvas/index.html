<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="editor.pageTitle">Design editor — Jataí</title>
    <script>
      // Aplica o tema antes do CSS para não piscar. Mesma chave de src/shared/theme.ts.
      (function () {
        var theme;
        try { theme = localStorage.getItem('jatai.theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo_jatai.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script type="module" src="/src/editor/main.ts"></script>
  </head>
  <body>
    <div class="editor">
      <header class="editor-header">
        <a class="back-link" href="/">
          <img src="/logo_jatai.png" alt="" width="28" height="28" />
          <span data-i18n="common.backToHub">All tools</span>
        </a>
        <input
          id="doc-title"
          class="doc-title"
          type="text"
          data-i18n-attr="placeholder:editor.untitled;aria-label:editor.untitled"
          placeholder="Untitled design"
        />
        <div class="header-actions">
          <button id="undo" class="icon-button" type="button" disabled data-i18n-attr="title:editor.actions.undo;aria-label:editor.actions.undo">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h11a5 5 0 0 1 0 10h-3" /></svg>
          </button>
          <button id="redo" class="icon-button" type="button" disabled data-i18n-attr="title:editor.actions.redo;aria-label:editor.actions.redo">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5" /><path d="M20 9H9a5 5 0 0 0 0 10h3" /></svg>
          </button>
          <div data-theme-toggle></div>
          <div data-lang-switcher></div>
          <button id="export" class="primary-button" type="button" data-i18n="editor.actions.export" data-i18n-attr="title:editor.actions.exportHint">Export</button>
        </div>
      </header>

      <nav id="toolbar" class="toolbar"></nav>

      <main id="stage" class="stage">
        <canvas id="stage-canvas"></canvas>
      </main>

      <aside class="panel">
        <button id="panel-close" class="panel-grip" type="button" data-i18n-attr="title:editor.mobile.close;aria-label:editor.mobile.close"></button>
        <!-- Configurações da tela: visíveis quando nada está selecionado. -->
        <section id="canvas-panel">
          <h2 data-i18n="editor.canvas.title">Canvas</h2>

          <label class="field">
            <span data-i18n="editor.canvas.preset">Size</span>
            <select id="canvas-preset"></select>
          </label>

          <div class="size-row">
            <label class="field">
              <span data-i18n="editor.canvas.width">Width</span>
              <span class="input-unit">
                <input id="canvas-width" type="number" step="1" inputmode="numeric" />
                <span aria-hidden="true">px</span>
              </span>
            </label>
            <button id="canvas-lock" class="icon-button lock-toggle" type="button" aria-pressed="false" data-i18n-attr="title:editor.canvas.lockRatio;aria-label:editor.canvas.lockRatio">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon-locked"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon-unlocked"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 7.5-1.9" /></svg>
            </button>
            <label class="field">
              <span data-i18n="editor.canvas.height">Height</span>
              <span class="input-unit">
                <input id="canvas-height" type="number" step="1" inputmode="numeric" />
                <span aria-hidden="true">px</span>
              </span>
            </label>
          </div>

          <button id="canvas-swap" class="secondary-button" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4" /></svg>
            <span data-i18n="editor.canvas.swap">Swap orientation</span>
          </button>

          <label class="field">
            <span data-i18n="editor.canvas.background">Background</span>
            <span class="color-field">
              <input id="canvas-background" type="color" data-i18n-attr="aria-label:editor.canvas.background" />
              <input id="canvas-background-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" />
              <button id="canvas-background-pick" class="icon-button eyedropper" type="button" data-i18n-attr="title:editor.props.pickColor;aria-label:editor.props.pickColor">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 22 1-1h3l9-9M3 21v-3l9-9" /><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z" /></svg>
              </button>
            </span>
          </label>
        </section>

        <!-- Propriedades do elemento selecionado (montado em properties-panel.ts). -->
        <section id="element-panel" hidden></section>

        <section>
          <h2 data-i18n="editor.panels.layers">Layers</h2>
          <p id="layers-empty" data-i18n="editor.panels.noLayers">No elements yet.</p>
          <ul id="layers-list" class="layers-list"></ul>
        </section>
      </aside>

      <footer class="statusbar">
        <span id="status-tool"></span>
        <span id="status-size"></span>
        <span class="status-hint" data-i18n="editor.status.navHint">Space + drag to pan · Ctrl + scroll to zoom · Hold Ctrl while dragging to move freely</span>
        <div class="zoom-controls">
          <button id="zoom-fit" class="icon-button" type="button" data-i18n-attr="title:editor.actions.fit;aria-label:editor.actions.fit">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          </button>
          <button id="zoom-out" class="icon-button" type="button" data-i18n-attr="title:editor.actions.zoomOut;aria-label:editor.actions.zoomOut">−</button>
          <span id="status-zoom"></span>
          <button id="zoom-in" class="icon-button" type="button" data-i18n-attr="title:editor.actions.zoomIn;aria-label:editor.actions.zoomIn">+</button>
        </div>
      </footer>
    </div>
  </body>
</html>
